name: CI — Rust Core, WASM & Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust fmt, clippy & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust unit & integration tests
        run: cargo test --workspace

  wasm-build:
    name: Build WASM package
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-rust

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Build sim_wasm for web target
        run: wasm-pack build src-rust/sim_wasm --target web --release --out-dir ../../src/wasm-pkg

      - name: Upload WASM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sim-wasm-pkg
          path: src/wasm-pkg/
          retention-days: 30

  web-build:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM package artifact
        uses: actions/download-artifact@v4
        with:
          name: sim-wasm-pkg
          path: src/wasm-pkg/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npm run lint

      - name: Production frontend build
        run: npm run build
